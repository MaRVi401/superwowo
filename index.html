<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">'
  <link rel="icon" href="wowo.png" type="image/png">
  <title>Super WOWO 2D</title>
  
  <!-- Tailwind CSS & p5.js CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

  <header class="mb-3 text-center">
    <h1 class="pixel-font text-xl md:text-3xl text-amber-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] tracking-wider mb-1">
      SUPER WOWO 2D
    </h1>
    <p class="text-xs md:text-sm text-slate-400 font-medium">
      Gunakan <span class="text-amber-300 font-semibold">A / D</span> atau <span class="text-amber-300 font-semibold">Panah Kiri/Kanan</span> untuk jalan, <span class="text-amber-300 font-semibold">W / Spasi / Panah Atas</span> untuk lompat.
    </p>
  </header>

  <!-- Game Canvas Container -->
  <div id="canvas-container" class="relative rounded-xl overflow-hidden border-4 border-slate-700 bg-sky-400">
    <!-- Canvas p5.js akan dipasang di sini -->
  </div>

  <!-- Touch Controls for Mobile Devices -->
  <div class="mt-3 flex sm:hidden gap-3 w-full max-w-md justify-between px-2">
    <div class="flex gap-2">
      <button id="btn-left" class="bg-slate-800 border-2 border-slate-600 active:bg-slate-700 text-white font-bold p-4 rounded-lg w-16 h-16 flex items-center justify-center text-xl shadow-lg active:scale-95">◄</button>
      <button id="btn-right" class="bg-slate-800 border-2 border-slate-600 active:bg-slate-700 text-white font-bold p-4 rounded-lg w-16 h-16 flex items-center justify-center text-xl shadow-lg active:scale-95">►</button>
    </div>
    <button id="btn-jump" class="bg-amber-500 border-2 border-amber-400 active:bg-amber-600 text-slate-900 font-bold p-4 rounded-lg w-20 h-16 flex items-center justify-center text-lg shadow-lg active:scale-95 pixel-font">JUMP</button>
  </div>

  <!-- Main Game Script -->
  <script src="sketch.js"></script>
</body>
</html>
