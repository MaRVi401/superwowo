<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Mencegah zoom otomatis pada layar HP saat ditekan -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER WOWO 2D</title>
  
  <!-- p5.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  
  <!-- Google Font Retro Arcade -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', cursive;
    }

    /* Container Canvas Responsif */
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    /* Tombol Kontrol Layar Sentuh (Mobile/Touch Controls) */
    .touch-controls {
      position: absolute;
      bottom: 120px; /* Posisi dinaikkan jauh lebih tinggi ke atas */
      left: 0;
      width: 100%;
      padding: 0 35px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 1000;
    }

    .touch-group {
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .btn-touch {
      width: 65px;
      height: 65px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.1s, transform 0.1s;
    }

    .btn-touch:active {
      background: rgba(51, 65, 85, 0.95);
      transform: scale(0.92);
    }

    /* Sembunyikan kontrol sentuh secara default pada layar PC/Laptop */
    @media (min-width: 1024px) and (hover: hover) {
      .touch-controls {
        display: none;
      }
    }

    /* Menyembunyikan Netlify Drawer / Badge */
    #netlify-modal-backdrop,
    .netlify-drawer,
    [data-netlify-deploy-id],
    iframe[src*="netlify"],
    div[class*="netlify"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="canvas-container"></div>

    <!-- UI Tombol Layar Sentuh untuk HP -->
    <div class="touch-controls">
      <div class="touch-group">
        <div id="btn-left" class="btn-touch">◀</div>
        <div id="btn-right" class="btn-touch">▶</div>
      </div>
      <div class="touch-group">
        <div id="btn-jump" class="btn-touch">▲</div>
      </div>
    </div>
  </div>

  <!-- Memuat Script Game Utama -->
  <script src="sketch.js"></script>
</body>
</html>
